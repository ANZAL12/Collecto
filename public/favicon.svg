<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="collectoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Outer Glow Border Gradient -->
    <linearGradient id="collectoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Checkmark & Spark Gradient -->
    <linearGradient id="collectoCheck" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Subtle Inner Shadow / Ambient Glow -->
    <radialGradient id="collectoGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#collectoBg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#collectoGlow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#collectoBorder)" stroke-width="2.5" stroke-opacity="0.75" />

  <!-- Geometric Modern 'C' Arc -->
  <!-- Center: ~31, 32; Radius: 14 -->
  <path
    d="M 42 20 A 14.5 14.5 0 1 0 42 44"
    fill="none"
    stroke="#ffffff"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Collection Checkmark through the 'C' -->
  <path
    d="M 28 32.5 L 34 38.5 L 48 23.5"
    fill="none"
    stroke="url(#collectoCheck)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Verified collection accent dot -->
  <circle cx="48" cy="23.5" r="2" fill="#34d399" />
</svg>
